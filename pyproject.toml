[project]
name = "wordpress-to-hugo-migration"
version = "0.1.0"
description = "migrating a WordPress blog to Hugo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lxml>=6.1.3",
    "markdownify>=1.2.3",
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "python-dotenv>=1.2.3",
    "python-slugify>=9.1.0",
    "tomli-w>=1.2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["*.ipynb"]


[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "UP",     # pyupgrade (modernize syntax)
    "B",      # flake8-bugbear (common bugs/footguns)
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
    "PTH",    # flake8-use-pathlib
    "N",      # pep8-naming
]
ignore = [
    "E501",   # line too long (let the formatter handle it)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # allow asserts in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

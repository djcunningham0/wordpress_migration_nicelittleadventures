[project]
name = "wordpress-to-hugo-migration"
version = "0.1.0"
description = "migrating a WordPress blog to Hugo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lxml>=6.1.3",
    "markdownify>=1.2.3",
    "mdformat>=1.0.0",
    "mdformat-footnote>=0.1.3",
    "mdformat-frontmatter>=2.1.2",
    "mdformat-gfm>=1.0.0",
    "mdformat-simple-breaks>=0.1.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
